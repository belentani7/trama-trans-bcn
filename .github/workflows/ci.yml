name: CI (pnpm)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm 9
        run: npm install -g pnpm@9 --no-audit --no-fund
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Source contract tests
        run: pnpm test
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: Production build
        run: pnpm run build
      - name: Rendered SSR contract tests
        run: pnpm run test:rendered
